[package]
name = "fern-init"
version = "0.1.0"
description = "Fern init and service manager (PID 1), fernctl, and fern-log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "ferninit"
path = "src/lib.rs"

[[bin]]
name = "fern-init"
path = "src/bin/fern-init.rs"

[[bin]]
name = "fernctl"
path = "src/bin/fernctl.rs"

[dependencies]
rustix = { version = "1.1.5", features = ["process", "mount", "system", "fs", "event", "pipe", "net", "stdio", "termios", "time", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
