[package]
name = "sol-init"
version = "0.1.0"
description = "Solace init and service manager (PID 1), solctl, and sol-log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "solinit"
path = "src/lib.rs"

[[bin]]
name = "sol-init"
path = "src/bin/sol-init.rs"

[[bin]]
name = "solctl"
path = "src/bin/solctl.rs"

[dependencies]
rustix = { version = "1.1.5", features = ["process", "mount", "system", "fs", "event", "pipe", "net", "stdio", "termios", "time", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
