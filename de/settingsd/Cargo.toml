[package]
name = "fern-settingsd"
version = "0.1.0"
description = "Fern settings daemon: typed settings over D-Bus, stored as TOML"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "settingsd"
path = "src/lib.rs"

[[bin]]
name = "fern-settingsd"
path = "src/bin/fern-settingsd.rs"

[[bin]]
name = "fern-settings"
path = "src/bin/fern-settings.rs"

[dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true

[dev-dependencies]
fern-bootgen = { path = "../../boot/bootgen" }
tempfile = "3.27.0"
