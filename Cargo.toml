[workspace]
resolver = "3"
members = ["tools/solcheck", "pkg/libspk", "pkg/spk", "init", "boot/bootgen", "de/comp", "de/comp/testclient"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/volntra/Solace-OS"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
match_same_arms = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
