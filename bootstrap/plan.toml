# The Fern bootstrap: from the host's compilers to a system that builds
# itself. Run with `just bootstrap` (spk bootstrap bootstrap/plan.toml).
# Format: docs/formats/bootstrap-plan.md. Follows Linux From Scratch
# chapters 5-8, with every step an ordinary signed spk package.

target = "x86_64-solace-linux-gnu"

[[stage]]
name = "cross"
description = "cross toolchain built with the host's compilers (LFS ch. 5)"
recipes_dir = "bootstrap/recipes"
repo = "build/bootstrap/repo"
toolchain = "cross"
recipes = ["cross-binutils", "cross-gcc", "linux-headers", "glibc", "cross-libstdcxx"]

[[stage]]
name = "temp"
description = "temporary tools, cross-compiled for Fern (LFS ch. 6)"
recipes_dir = "bootstrap/recipes"
repo = "build/bootstrap/repo"
toolchain = "cross"
base = ["cross-binutils", "cross-gcc", "cross-libstdcxx", "linux-headers", "glibc"]
recipes = [
    "m4", "ncurses", "bash", "coreutils", "diffutils", "file", "findutils",
    "gawk", "grep", "gzip", "make", "patch", "sed", "tar", "xz",
    "binutils", "gcc",
]

[[stage]]
name = "chroot"
description = "native temporary tools: no host tools from here on (LFS ch. 7)"
recipes_dir = "bootstrap/recipes"
repo = "build/bootstrap/repo"
toolchain = "native"
base = [
    "glibc", "linux-headers", "binutils", "gcc", "bash", "coreutils",
    "diffutils", "file", "findutils", "gawk", "grep", "gzip", "make", "m4",
    "ncurses", "patch", "sed", "tar", "xz",
]
recipes = ["gettext", "bison", "perl", "python"]

[[stage]]
name = "system"
description = "the final system, built natively with our own toolchain (LFS ch. 8)"
recipes_dir = "recipes"
repo = "build/system/repo"
dep_repos = ["build/bootstrap/repo"]
toolchain = "native"
base = [
    "glibc", "linux-headers", "binutils", "gcc", "bash", "coreutils",
    "diffutils", "file", "findutils", "gawk", "grep", "gzip", "make", "m4",
    "ncurses", "patch", "sed", "tar", "xz", "perl", "python", "bison", "gettext",
]
recipes = [
    # The boot path first.
    "linux-headers", "glibc", "zlib", "bzip2", "xz", "lz4", "zstd", "file",
    "m4", "flex", "ncurses", "readline", "bc", "bash", "coreutils",
    "diffutils", "gawk", "findutils", "grep", "gzip", "sed", "tar", "make",
    "patch", "less", "pkgconf", "libxcrypt", "shadow", "util-linux", "elfutils", "openssl", "linux",
    "fern-init", "fern-bootgen", "spk", "fern-base", "fern-grub-theme", "grub",
    # Then the self-hosting toolchain and the remaining libraries.
    "binutils", "gmp", "mpfr", "mpc", "gcc",
    "expat", "libffi", "pcre2", "libarchive",
    # The graphics base (Phase 4): build tools, then the stack under fern-comp.
    "python", "ninja", "meson", "python-markupsafe", "python-jinja2", "python-mako",
    "python-packaging", "python-pyyaml", "gperf", "libcap", "udev",
    "libdrm", "wayland", "wayland-protocols", "xkeyboard-config",
    "libxkbcommon", "libevdev", "mtdev", "libinput", "seatd", "libglvnd",
    "mesa", "fern-wallpapers", "inter", "fern-comp",
    # The desktop (Phase 6): the message bus, fonts, Qt 6 and the shell.
    "cmake", "dbus", "freetype", "fontconfig", "qtbase", "qtshadertools",
    "qtsvg", "qtdeclarative", "extra-cmake-modules",
    "layer-shell-qt", "glibc-locales", "fern-settingsd", "fern-indexd", "fern-icons", "fern-shell",
    # Optional hardware support (not in the base image).
    "nvidia",
]
