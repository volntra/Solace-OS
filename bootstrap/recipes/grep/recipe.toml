# LFS 6.10.
name = "grep"
version = "3.12~bootstrap"
release = 1
summary = "GNU grep (bootstrap)"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --host="$SOL_TGT" --build="$(./build-aux/config.guess)"
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
