# LFS 7.7. Native: the first stage built without any host tools.
name = "gettext"
version = "1.0~bootstrap"
release = 1
summary = "msgfmt, msgmerge, xgettext only (bootstrap)"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz"
sha256 = "85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a"

[build]
system = "custom"
configure = '''
./configure --disable-shared
'''
compile = '''
make
'''
install = '''
mkdir -p "$DESTDIR/usr/bin"
cp gettext-tools/src/{msgfmt,msgmerge,xgettext} "$DESTDIR/usr/bin/"
'''
