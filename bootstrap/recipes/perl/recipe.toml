# LFS 7.9. No man pages: the chroot has no man directories, so Configure
# would otherwise install them at / (and this perl only runs build scripts).
name = "perl"
version = "5.42.3~bootstrap"
release = 1
summary = "Perl 5 (bootstrap)"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"

[[source]]
url = "https://www.cpan.org/src/5.0/perl-5.42.3.tar.gz"
sha256 = "1137740985837b5cdf15f0cfab932279dcb4352f912fed6fc144e8b4f0823627"

[build]
system = "custom"
configure = '''
sh Configure -des -D prefix=/usr -D vendorprefix=/usr -D useshrplib \
  -D privlib=/usr/lib/perl5/5.42/core_perl -D archlib=/usr/lib/perl5/5.42/core_perl \
  -D sitelib=/usr/lib/perl5/5.42/site_perl -D sitearch=/usr/lib/perl5/5.42/site_perl \
  -D vendorlib=/usr/lib/perl5/5.42/vendor_perl -D vendorarch=/usr/lib/perl5/5.42/vendor_perl \
  -D man1dir=none -D man3dir=none
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
