# LFS 6.12.
name = "make"
version = "4.4.1~bootstrap"
release = 1
summary = "GNU make (bootstrap)"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --host="$SOL_TGT" --build="$(build-aux/config.guess)" --without-guile
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
