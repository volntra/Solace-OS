# LFS 5.5.
name = "glibc"
version = "2.44~bootstrap"
release = 1
summary = "GNU C library, cross-compiled (bootstrap)"
license = "LGPL-2.1-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
dir = "glibc-2.44"

[deps]
build = ["cross-binutils", "cross-gcc", "linux-headers"]

[build]
system = "custom"
configure = '''
mkdir -v build && cd build
# Merged /usr: libraries and the dynamic loader live in /usr/lib (the
# ELF interpreter path /lib64/ld-linux-x86-64.so.2 reaches it through
# the /lib64 -> usr/lib link).
printf '%s\n' rootsbindir=/usr/sbin slibdir=/usr/lib rtlddir=/usr/lib > configparms
../configure --prefix=/usr --libdir=/usr/lib --host="$SOL_TGT" \
  --build="$(../scripts/config.guess)" --enable-kernel=5.4 \
  --with-headers=/usr/include --disable-nscd --disable-werror \
  libc_cv_slibdir=/usr/lib
'''
compile = '''
make -C build
'''
install = '''
make -C build DESTDIR="$DESTDIR" install
'''
post_install = '''
sed '/RTLDLIST=/s@/usr@@g' -i "$DESTDIR/usr/bin/ldd"
rm -rf "$DESTDIR/var"
'''
