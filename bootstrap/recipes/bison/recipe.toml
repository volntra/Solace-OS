# LFS 7.8.
name = "bison"
version = "3.8.2~bootstrap"
release = 1
summary = "GNU parser generator (bootstrap)"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.gz"
sha256 = "06c9e13bdf7eb24d4ceb6b59205a4f67c2c7e7213119644430fe82fbd14a0abb"

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --docdir=/usr/share/doc/bison
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
