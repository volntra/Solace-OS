# LFS 7.10. Needed natively by the final glibc build. Optional modules whose
# libraries are not in the sysroot yet are simply not built.
name = "python"
version = "3.14.7~bootstrap"
release = 1
summary = "Python 3 (bootstrap)"
license = "Python-2.0"

[[source]]
url = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --enable-shared --without-ensurepip --without-static-libpython
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
