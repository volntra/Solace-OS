# Built with its own bootstrap script (Python + the C++ compiler), as LFS
# does; the build tool behind every meson recipe.
name = "ninja"
version = "1.13.2"
release = 1
summary = "Small build system with a focus on speed"
license = "Apache-2.0"
homepage = "https://ninja-build.org/"

[[source]]
url = "https://github.com/ninja-build/ninja/archive/v1.13.2.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"
# The same file, kept by Gentoo (checked against its Manifest).
mirrors = ["https://distfiles.gentoo.org/distfiles/67/ninja-1.13.2.tar.gz"]

[deps]
# C++: libstdc++ and libgcc_s at runtime.
runtime = ["gcc-libs"]

[build]
system = "custom"
compile = '''
python3 configure.py --bootstrap
'''
install = '''
install -Dm755 ninja "$DESTDIR/usr/bin/ninja"
'''
