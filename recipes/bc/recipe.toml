# Gavin Howard's bc, as LFS 8.16 uses.
name = "bc"
version = "7.0.3"
release = 1
summary = "Arbitrary-precision calculator (needed to build the kernel)"
license = "BSD-2-Clause"

[[source]]
url = "https://github.com/gavinhoward/bc/releases/download/7.0.3/bc-7.0.3.tar.xz"
sha256 = "91eb74caed0ee6655b669711a4f350c25579778694df248e28363318e03c7fc4"

[deps]
build = ["readline", "ncurses"]
runtime = ["readline", "ncurses"]

[build]
system = "custom"
# C17: under GCC's default C23, true/false are keywords and bc's
# token pasting (true##UL) breaks.
configure = '''
CC=gcc CFLAGS="-std=gnu17" ./configure --prefix=/usr -G -O3 -r
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
