# Font rasterizer for Qt (through fontconfig). No HarfBuzz, PNG or Brotli:
# Qt shapes text with its own HarfBuzz, and color bitmap fonts come later.
name = "freetype"
version = "2.15.0"
release = 1
summary = "Font rendering library"
license = "FTL OR GPL-2.0-or-later"
homepage = "https://freetype.org/"

[[source]]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz"
sha256 = "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"

[deps]
build = ["python", "meson", "ninja", "pkgconf", "zlib", "libbz2", "bzip2"]
runtime = ["zlib", "libbz2"]

[build]
system = "meson"
configure_args = [
    "-Dharfbuzz=disabled", "-Dpng=disabled", "-Dbrotli=disabled",
    "-Dbzip2=enabled", "-Dzlib=system", "-Dtests=disabled",
]
