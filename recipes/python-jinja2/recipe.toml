# Pure Python, copied into site-packages (no pip needed).
name = "python-jinja2"
version = "3.1.6"
release = 1
summary = "Jinja template engine for Python"
license = "BSD-3-Clause"
homepage = "https://palletsprojects.com/p/jinja/"

[[source]]
url = "https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz"
sha256 = "0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d"

[deps]
runtime = ["python", "python-markupsafe"]

[build]
system = "custom"
# Pure Python: nothing to compile.
compile = "true"
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
mkdir -p "$DESTDIR$site"
cp -r src/jinja2 "$DESTDIR$site/"
find "$DESTDIR$site" -name '*.c' -delete
python3 -m compileall -q --invalidation-mode checked-hash -s "$DESTDIR" "$DESTDIR$site/jinja2"
'''
