name = "xkeyboard-config"
version = "2.48"
release = 1
summary = "Keyboard layouts and rules (XKB data)"
license = "MIT"
homepage = "https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config"

[[source]]
url = "https://www.x.org/releases/individual/data/xkeyboard-config/xkeyboard-config-2.48.tar.xz"
sha256 = "b77041324f0109f77161ee43743fe04baa485866af8460d31e476ad3f7648fd5"

[deps]
build = ["python", "meson", "ninja", "pkgconf"]

[build]
system = "meson"
# No translations yet (no gettext in the system), no X server symlinks.
configure_args = ["-Dnls=false", "-Dxorg-rules-symlinks=false", "-Dnon-latin-layouts-list=false"]
