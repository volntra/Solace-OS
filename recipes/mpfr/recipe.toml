name = "mpfr"
version = "4.2.2"
release = 1
summary = "Multiple-precision floating point library"
license = "LGPL-3.0-or-later"

[[source]]
url = "https://www.mpfr.org/mpfr-4.2.2/mpfr-4.2.2.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"

[deps]
build = ["gmp"]
runtime = ["gmp"]

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --disable-static --enable-thread-safe
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
