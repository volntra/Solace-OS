# NVIDIA's driver for GeForce RTX 20 and newer (the open kernel modules;
# the human's RTX 5070 Ti needs them): kernel modules, GSP firmware, and
# the userspace driver for EGL/GLES (through libglvnd), GBM and
# Wayland/GBM EGL platforms, plus nvidia-smi. Not in the base image: the
# installer offers it when it finds an NVIDIA GPU (CLAUDE.md 6.17).
#
# One source for both halves: NVIDIA's .run installer carries the open
# modules' source (kernel-open/) next to the userspace. The userspace is
# NVIDIA's binary, redistributed unmodified (NVIDIA Software License).
# Not yet: Vulkan (needs the Vulkan loader), CUDA, VDPAU/NVENC.
name = "nvidia"
version = "595.104.02"
release = 1
summary = "NVIDIA graphics driver (userspace)"
license = "LicenseRef-NVIDIA-Software-License"
homepage = "https://www.nvidia.com/en-us/drivers/unix/"

[[source]]
local = "recipes/nvidia"
dir = "nvidia"

[[source]]
url = "https://download.nvidia.com/XFree86/Linux-x86_64/595.104.02/NVIDIA-Linux-x86_64-595.104.02.run"
sha256 = "e421c202e4c79f58c3c7f3161bbe71454ebb3d88936f88205a0e327cd04c59ca"
# The same file, kept by Gentoo (checked against its Manifest).
mirrors = ["https://distfiles.gentoo.org/distfiles/17/NVIDIA-Linux-x86_64-595.104.02.run"]
extract = false

[deps]
# The modules are built against exactly this kernel.
build = ["linux-build=7.2-3", "zstd"]
runtime = ["nvidia-kmod", "libglvnd", "mesa", "wayland", "libdrm", "gcc-libs"]

[build]
system = "custom"
configure = '''
sh ../NVIDIA-Linux-x86_64-595.104.02.run --extract-only --target nv >/dev/null
'''
compile = '''
kbuild=$(echo /usr/lib/modules/*/build)
make -C nv/kernel-open SYSSRC="$kbuild" SYSOUT="$kbuild" modules
'''
install = '''
v=595.104.02
kbuild=$(echo /usr/lib/modules/*/build)
release=$(basename "$(dirname "$kbuild")")
# Kernel modules (compressed; fern-init loads them, see 20-nvidia.conf).
m="$DESTDIR/usr/lib/modules/$release/extra/nvidia"
install -d "$m"
for k in nvidia nvidia-modeset nvidia-drm nvidia-uvm nvidia-peermem; do
  install -m644 "nv/kernel-open/$k.ko" "$m/"
  zstd -q --rm -19 "$m/$k.ko"
done
install -Dm644 20-nvidia.conf "$DESTDIR/usr/lib/fern/modules.d/20-nvidia.conf"
install -Dm755 nvidia-devices "$DESTDIR/usr/lib/fern/nvidia-devices"
install -Dm644 units/nvidia-devices.toml "$DESTDIR/usr/lib/fern/units/nvidia-devices.toml"
# GSP firmware (the open modules run the GPU's firmware processor).
install -Dt "$DESTDIR/usr/lib/firmware/nvidia/$v" -m644 nv/firmware/gsp_*.bin

# Userspace: EGL and GLES through libglvnd, GBM, the Wayland and GBM EGL
# platforms, nvidia-smi.
l="$DESTDIR/usr/lib"
install -d "$l/gbm"
for f in libEGL_nvidia libGLESv2_nvidia libGLESv1_CM_nvidia libnvidia-eglcore \
         libnvidia-glcore libnvidia-glsi libnvidia-tls libnvidia-gpucomp \
         libnvidia-glvkspirv libnvidia-allocator libnvidia-ml libnvidia-cfg; do
  install -m755 "nv/$f.so.$v" "$l/"
done
install -m755 nv/libnvidia-egl-gbm.so.1.* nv/libnvidia-egl-wayland.so.1.* "$l/"
ln -s "libEGL_nvidia.so.$v" "$l/libEGL_nvidia.so.0"
ln -s "libGLESv2_nvidia.so.$v" "$l/libGLESv2_nvidia.so.2"
ln -s "libGLESv1_CM_nvidia.so.$v" "$l/libGLESv1_CM_nvidia.so.1"
ln -s "libnvidia-allocator.so.$v" "$l/libnvidia-allocator.so.1"
ln -s "libnvidia-ml.so.$v" "$l/libnvidia-ml.so.1"
ln -s "libnvidia-cfg.so.$v" "$l/libnvidia-cfg.so.1"
ln -s "$(basename nv/libnvidia-egl-gbm.so.1.*)" "$l/libnvidia-egl-gbm.so.1"
ln -s "$(basename nv/libnvidia-egl-wayland.so.1.*)" "$l/libnvidia-egl-wayland.so.1"
# Mesa's libgbm loads the backend named after the kernel driver.
ln -s ../libnvidia-allocator.so.1 "$l/gbm/nvidia-drm_gbm.so"
install -Dm644 nv/10_nvidia.json "$DESTDIR/usr/share/glvnd/egl_vendor.d/10_nvidia.json"
install -Dm644 nv/15_nvidia_gbm.json nv/10_nvidia_wayland.json \
  -t "$DESTDIR/usr/share/egl/egl_external_platform.d"
install -Dm755 nv/nvidia-smi "$DESTDIR/usr/bin/nvidia-smi"
'''

[[split]]
name = "nvidia-kmod"
summary = "NVIDIA open kernel modules and GPU firmware (for linux 7.2-3)"
files = [
    "usr/lib/modules",
    "usr/lib/firmware",
    "usr/lib/fern/modules.d/20-nvidia.conf",
    "usr/lib/fern/nvidia-devices",
    "usr/lib/fern/units/nvidia-devices.toml",
]
depends = ["linux=7.2-3"]
