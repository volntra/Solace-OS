name = "wayland"
version = "1.26.0"
release = 1
summary = "Wayland protocol libraries and wayland-scanner"
license = "MIT"
homepage = "https://wayland.freedesktop.org/"

[[source]]
url = "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.26.0/downloads/wayland-1.26.0.tar.xz"
sha256 = "64176eaa46e4969903e286f8e5ef8331affc17fdf03ac9b58381d2b23162b7a3"

[deps]
build = ["python", "meson", "ninja", "pkgconf", "libffi", "expat"]
runtime = ["libffi", "expat"]

[build]
system = "meson"
configure_args = ["-Ddocumentation=false", "-Dtests=false", "-Ddtd_validation=false"]
