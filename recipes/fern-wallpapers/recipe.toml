# Our wallpapers (assets/wallpapers/*.svg), rendered to PNG. Host
# toolchain for the renderer (resvg, from the dev workbench) until it has
# a recipe; the output is data generated from our own sources.
name = "fern-wallpapers"
version = "0.1"
release = 2
summary = "Fern wallpapers"
license = "GPL-3.0-or-later"

[[source]]
local = "assets/wallpapers"
include = ["grove.svg", "grove-night.svg", "grove-blurred.svg"]

[build]
system = "custom"
toolchain = "host"
compile = '''
resvg -w 2560 grove.svg grove.png
resvg -w 2560 grove-night.svg grove-night.png
'''
install = '''
install -Dm644 grove.png "$DESTDIR/usr/share/fern/wallpapers/grove.png"
install -Dm644 grove-night.png "$DESTDIR/usr/share/fern/wallpapers/grove-night.png"
'''
