# Pure Python, copied into site-packages (no pip needed).
name = "python-packaging"
version = "26.3"
release = 1
summary = "Python packaging version utilities"
license = "Apache-2.0 OR BSD-2-Clause"
homepage = "https://packaging.pypa.io/"

[[source]]
url = "https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz"
sha256 = "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"

[deps]
runtime = ["python"]

[build]
system = "custom"
# Pure Python: nothing to compile.
compile = "true"
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
mkdir -p "$DESTDIR$site"
cp -r src/packaging "$DESTDIR$site/"
find "$DESTDIR$site" -name '*.c' -delete
python3 -m compileall -q --invalidation-mode checked-hash -s "$DESTDIR" "$DESTDIR$site/packaging"
'''
