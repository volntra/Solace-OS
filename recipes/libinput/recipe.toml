# No tablet database (libwacom), debug GUI or Lua plugins.
name = "libinput"
version = "1.32.0"
release = 1
summary = "Input device handling for Wayland compositors"
license = "MIT"
homepage = "https://gitlab.freedesktop.org/libinput/libinput"

[[source]]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.32.0/libinput-1.32.0.tar.bz2"
sha256 = "3a6065c07b118c08d0c7b7b85a265ecb050a8cfc91eeb360890d768a51b4cce9"

[deps]
build = ["python", "meson", "ninja", "pkgconf", "bzip2", "libevdev", "mtdev", "libudev"]
runtime = ["libevdev", "mtdev", "libudev"]

[build]
system = "meson"
configure_args = [
    "-Dlibwacom=false", "-Ddebug-gui=false", "-Dtests=false",
    "-Dinstall-tests=false", "-Ddocumentation=false",
    "-Dlua-plugins=disabled", "-Dzshcompletiondir=no",
    "-Dudev-dir=/usr/lib/udev",
]
