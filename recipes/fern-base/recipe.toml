# Our own: image/base/ in this repository. The system's identity
# (os-release), first-boot /etc defaults, and the console login units.
name = "fern-base"
version = "0.1"
release = 6
summary = "Fern base files: os-release, factory /etc, console login units"
license = "GPL-3.0-or-later"

[[source]]
local = "image/base"

[deps]
runtime = ["fern-init", "bash", "coreutils", "shadow", "util-linux"]

[build]
system = "custom"
compile = "true"
install = '''
cp -R usr "$DESTDIR/"
# Local sources carry no symlinks; /etc/os-release points into the system.
ln -s ../usr/lib/os-release "$DESTDIR/usr/share/factory/etc/os-release"
# git does not keep these modes.
chmod 600 "$DESTDIR/usr/share/factory/etc/shadow" "$DESTDIR/usr/share/factory/etc/gshadow"
'''
