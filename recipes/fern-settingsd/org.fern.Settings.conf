<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- fern-settingsd --system: only root owns the name; anyone may call it
     (the daemon itself allows changes only from root). -->
<busconfig>
  <policy user="root">
    <allow own="org.fern.Settings"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.fern.Settings"/>
  </policy>
</busconfig>
