# Pure Python, copied into site-packages (no pip needed).
name = "python-pyyaml"
version = "6.0.3"
release = 1
summary = "YAML parser for Python (pure-Python build)"
license = "MIT"
homepage = "https://pyyaml.org/"

[[source]]
url = "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
sha256 = "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"

[deps]
runtime = ["python"]

[build]
system = "custom"
# Pure Python: nothing to compile.
compile = "true"
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
mkdir -p "$DESTDIR$site"
cp -r lib/yaml "$DESTDIR$site/"
find "$DESTDIR$site" -name '*.c' -delete
python3 -m compileall -q --invalidation-mode checked-hash -s "$DESTDIR" "$DESTDIR$site/yaml"
'''
