# libseat (how a compositor opens DRM and input devices without root) and
# the small seatd daemon. libseat's logind backend is added with elogind.
name = "seatd"
version = "0.9.3"
release = 1
summary = "Seat management daemon and libseat"
license = "MIT"
homepage = "https://sr.ht/~kennylevinsen/seatd/"

[[source]]
url = "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz"
sha256 = "302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96"
# The same file, kept by Gentoo (checked against its Manifest).
mirrors = ["https://distfiles.gentoo.org/distfiles/ae/seatd-0.9.3.tar.gz"]

[deps]
build = ["python", "meson", "ninja", "pkgconf"]

[build]
system = "meson"
configure_args = [
    "-Dlibseat-logind=disabled", "-Dlibseat-seatd=enabled",
    "-Dlibseat-builtin=enabled", "-Dserver=enabled",
    "-Dexamples=disabled", "-Dman-pages=disabled",
]
