# Our own: boot/bootgen/ in this repository.
name = "fern-bootgen"
version = "0.1.0"
release = 1
summary = "grub.cfg generator, ESP kernel manager, and initramfs builder"
license = "GPL-3.0-or-later"

[[source]]
local = "."
# The Cargo workspace only: other changes in the repo do not rebuild it.
# de/comp only by its manifest: cargo must load every workspace member, but
# compositor changes should not rebuild this package.
include = ["Cargo.toml", "Cargo.lock", "init", "boot/bootgen", "pkg", "tools/ferncheck", "de/comp/Cargo.toml", "de/protocols", "de/wm/Cargo.toml", "de/settingsd/Cargo.toml", "de/indexer/Cargo.toml", "third_party/smithay"]

[build]
system = "custom"
toolchain = "rust"
cargo = true
compile = '''
cargo build --release --locked --offline --target x86_64-unknown-linux-gnu -p fern-bootgen
'''
install = '''
out=/build/target/x86_64-unknown-linux-gnu/release
install -Dm755 "$out/fern-bootgen" "$DESTDIR/usr/sbin/fern-bootgen"
install -Dm755 "$out/fern-mkinitramfs" "$DESTDIR/usr/sbin/fern-mkinitramfs"
'''
