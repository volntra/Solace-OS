name = "pcre2"
version = "10.48"
release = 1
summary = "Perl-compatible regular expression library"
license = "BSD-3-Clause"
homepage = "https://pcre2project.github.io/pcre2/"

[[source]]
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.bz2"
sha256 = "b6c68fdf6f3ac31388b50aa89ff0fc49c00c987c16e7b5146491d12003f2c8ed"

[deps]
# bzip2: the source is .tar.bz2, unpacked inside the sandbox.
build = ["zlib", "libbz2", "bzip2"]
runtime = ["zlib", "libbz2"]

[build]
system = "autotools"
configure_args = [
    "--disable-static",
    "--enable-unicode",
    "--enable-jit",
    "--enable-pcre2-16",
    "--enable-pcre2-32",
    "--enable-pcre2grep-libz",
    "--enable-pcre2grep-libbz2",
]
