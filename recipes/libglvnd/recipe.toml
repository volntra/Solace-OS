# The GL vendor dispatch libraries (libEGL, libGLESv2, libOpenGL): Mesa and
# NVIDIA's driver both plug into them, so one system serves both.
name = "libglvnd"
version = "1.7.0"
release = 1
summary = "GL Vendor-Neutral Dispatch library"
license = "MIT"
homepage = "https://gitlab.freedesktop.org/glvnd/libglvnd"

[[source]]
url = "https://gitlab.freedesktop.org/glvnd/libglvnd/-/archive/v1.7.0/libglvnd-v1.7.0.tar.bz2"
sha256 = "d0e1925a3c9aee0143b8c181ac31d5637c8faa081759c277b8e16c7075612c11"

[deps]
build = ["python", "meson", "ninja", "pkgconf", "bzip2"]

[build]
system = "meson"
configure_args = ["-Dx11=disabled", "-Dglx=disabled", "-Dgles1=false"]
