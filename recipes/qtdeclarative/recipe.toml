# QML and Qt Quick (with Controls templates, Layouts, Shapes and Effects):
# the shell, our apps and the design system are written in QML. Only the
# Basic Controls style (our design system draws its own on the
# templates); no Qt Labs, Quick Dialogs (ours come with Files), particles,
# XML list model, profiler or designer support. A full build needs over
# 11 GB of disk; this one (no precompiled headers) much less.
name = "qtdeclarative"
version = "6.12.0"
release = 1
summary = "Qt 6 QML and Qt Quick"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
homepage = "https://www.qt.io/"

[[source]]
url = "https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtdeclarative-everywhere-src-6.12.0.tar.xz"
sha256 = "311f3a2603e1973bb59baef9dfa740a376de713157d4782ee043681e889c9260"

[deps]
build = ["cmake", "ninja", "pkgconf", "python", "qtbase", "qtshadertools"]
runtime = ["qtbase"]

[build]
system = "cmake"
configure_args = [
    "-DQT_BUILD_EXAMPLES=OFF", "-DQT_BUILD_TESTS=OFF",
    "-DBUILD_WITH_PCH=OFF",
    "-DFEATURE_qml_debug=OFF", "-DFEATURE_quick_designer=OFF",
    "-DFEATURE_qml_profiler=OFF", "-DFEATURE_qml_preview=OFF",
    "-DFEATURE_qml_designsupport=OFF", "-DFEATURE_qml_labs=OFF",
    "-DFEATURE_qml_xmllistmodel=OFF",
    "-DFEATURE_quick_dialogs=OFF", "-DFEATURE_quick_particles=OFF",
    "-DFEATURE_quickshapes_designhelpers=OFF",
    "-DFEATURE_quickcontrols2_fusion=OFF", "-DFEATURE_quickcontrols2_imagine=OFF",
    "-DFEATURE_quickcontrols2_ios=OFF", "-DFEATURE_quickcontrols2_macos=OFF",
    "-DFEATURE_quickcontrols2_material=OFF", "-DFEATURE_quickcontrols2_universal=OFF",
    "-DFEATURE_quickcontrols2_windows=OFF", "-DFEATURE_quickcontrols2_fluentwinui3=OFF",
    "-DFEATURE_quickcontrols2_stylekit=OFF",
]
