# Pure Python, copied into site-packages (no pip needed).
name = "python-mako"
version = "1.4.3"
release = 1
summary = "Mako template engine for Python"
license = "MIT"
homepage = "https://www.makotemplates.org/"

[[source]]
url = "https://files.pythonhosted.org/packages/5a/09/e07c4b5579a79f4b16f8d4f29f6c54514ac787c4ad506b8c4f28a0e6b0bf/mako-1.4.3.tar.gz"
sha256 = "cd6537fe88d5fec315c55c2f8529bc4ce7a9a352ad7db3eeaa6a66e2dd4ec37a"

[deps]
runtime = ["python", "python-markupsafe"]

[build]
system = "custom"
# Pure Python: nothing to compile.
compile = "true"
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
mkdir -p "$DESTDIR$site"
cp -r mako "$DESTDIR$site/"
find "$DESTDIR$site" -name '*.c' -delete
python3 -m compileall -q --invalidation-mode checked-hash -s "$DESTDIR" "$DESTDIR$site/mako"
'''
