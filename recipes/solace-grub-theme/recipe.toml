# Our GRUB gfxmenu theme and its Inter fonts. Data only (PNG, PF2,
# theme.txt); the image builder copies it onto the ESP.
#
# Host toolchain for now: grub-mkfont comes from the dev workbench until
# our own GRUB recipe can be fetched (docs/STATUS.md). The output is
# plain data generated from our own sources.
name = "solace-grub-theme"
version = "0.1"
release = 1
summary = "Solace boot menu theme"
license = "GPL-3.0-or-later AND OFL-1.1"

[[source]]
local = "boot/grub-theme"
dir = "grub-theme"

[[source]]
local = "assets"

[[source]]
url = "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip"
sha256 = "9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e"
extract = false

[build]
system = "custom"
toolchain = "host"
compile = '''
bash build.sh /build/out/themes/solace /build/out/fonts ../Inter-4.1.zip ../assets
'''
install = '''
mkdir -p "$DESTDIR/usr/share/sol/grub"
cp -r /build/out/themes /build/out/fonts "$DESTDIR/usr/share/sol/grub/"
'''
