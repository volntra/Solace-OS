# Qt's Wayland platform plugin (client side only: Qt is never our
# compositor). Brings xdg-shell, decorations and the KDE blur protocol
# fern-comp speaks.
name = "qtwayland"
version = "6.12.0"
release = 1
summary = "Qt 6 Wayland client platform plugin"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
homepage = "https://www.qt.io/"

[[source]]
url = "https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtwayland-everywhere-src-6.12.0.tar.xz"
sha256 = "ae14d9bcf1bb3c300a3ab2e6a53f50284e5c6c966a4ac4cc5aedcb1bc74e4d02"

[deps]
build = ["cmake", "ninja", "pkgconf", "qtbase", "qtdeclarative", "wayland", "libxkbcommon", "libglvnd"]
runtime = ["qtbase", "qtdeclarative", "wayland", "libxkbcommon", "libglvnd"]

[build]
system = "cmake"
configure_args = [
    "-DQT_BUILD_EXAMPLES=OFF", "-DQT_BUILD_TESTS=OFF",
    "-DFEATURE_wayland_server=OFF", "-DFEATURE_wayland_brcm=OFF",
    "-DFEATURE_wayland_vulkan_server_buffer=OFF",
]
