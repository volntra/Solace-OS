name = "coreutils"
version = "9.11"
release = 1
summary = "GNU core utilities"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.11.tar.xz"
sha256 = "394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3"

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --enable-no-install-program=kill,uptime --without-openssl
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
