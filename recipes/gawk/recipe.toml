name = "gawk"
version = "5.4.1"
release = 1
summary = "GNU awk"
license = "GPL-3.0-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[deps]
build = ["readline"]
runtime = ["readline"]

[build]
system = "custom"
prepare = '''
# Upstream fix (gawk commit bf85f8a3, 2026-07): without MPFR/GMP, 5.4.1's
# NODE layout corrupts uninitialized values ("" prints as "0"), which
# breaks awk-generated code such as GCC's options.cc.
patch -p1 < "$RECIPE/node-struct-without-mpfr.patch"
sed -i 's/extras//' Makefile.in
'''
configure = '''
./configure --prefix=/usr
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
