# LFS 8.49 (libelf only).
name = "elfutils"
version = "0.195"
release = 1
summary = "libelf (needed to build the kernel)"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"

[[source]]
url = "https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2"
sha256 = "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"

[deps]
build = ["zlib", "zstd", "xz", "bzip2"]
runtime = ["zlib", "libzstd", "liblzma", "libbz2"]

[build]
system = "custom"
configure = '''
./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy
'''
compile = '''
make
'''
install = '''
make -C libelf DESTDIR="$DESTDIR" install
install -Dm644 config/libelf.pc "$DESTDIR/usr/lib/pkgconfig/libelf.pc"
rm -f "$DESTDIR/usr/lib/libelf.a"
'''
