description = "Fern desktop session on the display"
enabled = true
requires = ["seatd", "udev-trigger"]

[service]
# Root until the login screen (Phase 9) starts sessions for users. The
# session script (fern-shell's) adds the session bus, settings and shell;
# without it, the compositor alone.
exec = ["/bin/sh", "-c", "mkdir -p -m 0700 /run/user/0 && if [ -x /usr/lib/fern/fern-session ]; then exec /usr/lib/fern/fern-session; else exec /usr/bin/fern-comp --drm; fi"]
environment = { XDG_RUNTIME_DIR = "/run/user/0", HOME = "/root", LIBSEAT_BACKEND = "seatd", RUST_LOG = "info" }
restart = "on-failure"
restart_delay_ms = 1000
