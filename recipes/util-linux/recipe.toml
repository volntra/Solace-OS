# LFS 8.80. login and su come from shadow (no PAM yet). Packages carry
# only root-owned files, so no chown at install, no setgid-tty wall, and
# mount/umount are not setuid (users mount drives through udisks).
name = "util-linux"
version = "2.42.3"
release = 2
summary = "Essential system utilities (mount, agetty, fdisk, ...)"
license = "GPL-2.0-or-later"

[[source]]
url = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
sha256 = "66ac7c0e725278eb2b039e3104f2c91119341d941b41bac7a285c695f940bd57"

[deps]
# more(1) links libmagic (file): it is in the build base, so configure
# finds it.
build = ["ncurses", "file"]
runtime = ["ncurses", "file"]

[build]
system = "custom"
configure = '''
./configure --bindir=/usr/bin --libdir=/usr/lib --runstatedir=/run --sbindir=/usr/sbin \
  --disable-chfn-chsh --disable-login --disable-nologin --disable-su \
  --disable-setpriv --disable-runuser --disable-pylibmount --disable-liblastlog2 \
  --disable-wall --disable-makeinstall-chown --disable-makeinstall-setuid \
  --disable-static --without-python --without-systemd \
  --without-systemdsystemunitdir ADJTIME_PATH=/var/lib/hwclock/adjtime
'''
compile = '''
make
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
