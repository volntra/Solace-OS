# Our own: de/comp in this repository, built with only the DRM backend
# (the nested one is for development). Linked dynamically: it loads EGL
# and GBM drivers, which a static binary cannot.
name = "sol-comp"
version = "0.1.0"
release = 1
summary = "Solace compositor"
license = "GPL-3.0-or-later"

[[source]]
local = "."
# The Cargo workspace only.
include = ["Cargo.toml", "Cargo.lock", "init", "boot/bootgen", "pkg", "tools/solcheck", "de/comp"]

[deps]
build = ["pkgconf", "seatd", "libinput", "libudev", "mesa", "libglvnd", "libdrm", "libxkbcommon"]
runtime = ["seatd", "libinput", "libudev", "mesa", "libglvnd", "libxkbcommon", "xkeyboard-config", "gcc-libs", "solace-wallpapers", "udev"]

[build]
system = "custom"
toolchain = "rust"
cargo = true
compile = '''
# Not the rust toolchain's static default: see the comment at the top.
RUSTFLAGS="-C linker=cc" cargo build --release --locked --offline \
  --target x86_64-unknown-linux-gnu -p sol-comp --no-default-features --features drm \
  --bin sol-comp --bin sol-testclient
'''
install = '''
out=/build/target/x86_64-unknown-linux-gnu/release
install -Dm755 "$out/sol-comp" "$DESTDIR/usr/bin/sol-comp"
# The test client, for the image's smoke tests (image/qemu-test-comp.py).
install -Dm755 "$out/sol-testclient" "$DESTDIR/usr/lib/sol/test/sol-testclient"
install -Dm644 "$RECIPE/units/sol-comp.toml" "$DESTDIR/usr/lib/sol/units/sol-comp.toml"
'''
