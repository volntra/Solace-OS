# LFS 8.5. The interpreter path stays /lib64/ld-linux-x86-64.so.2 (via /lib64 -> usr/lib).
name = "glibc"
version = "2.44"
release = 1
summary = "GNU C library"
license = "LGPL-2.1-or-later"

[[source]]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
dir = "glibc-2.44"

[build]
system = "custom"
configure = '''
mkdir -v build && cd build
printf '%s\n' rootsbindir=/usr/sbin slibdir=/usr/lib rtlddir=/usr/lib > configparms
../configure --prefix=/usr --libdir=/usr/lib --disable-werror \
  --enable-kernel=5.4 --enable-stack-protector=strong --disable-nscd \
  libc_cv_slibdir=/usr/lib
'''
compile = '''
make -C build
'''
install = '''
make -C build DESTDIR="$DESTDIR" install
'''
post_install = '''
sed '/RTLDLIST=/s@/usr@@g' -i "$DESTDIR/usr/bin/ldd"
# The loader searches /usr/lib without a cache; ldconfig runs as a
# system-transaction trigger (Phase 3).
rm -rf "$DESTDIR/var" "$DESTDIR/etc/ld.so.cache"
'''
