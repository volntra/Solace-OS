# Pure Python: the mesonbuild package goes into site-packages and meson.py
# becomes /usr/bin/meson (no setuptools/pip needed).
name = "meson"
version = "1.12.1"
release = 1
summary = "Meson build system"
license = "Apache-2.0"
homepage = "https://mesonbuild.com/"

[[source]]
url = "https://github.com/mesonbuild/meson/releases/download/1.12.1/meson-1.12.1.tar.gz"
sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743"

[deps]
runtime = ["python", "ninja"]

[build]
system = "custom"
# Pure Python: nothing to compile.
compile = "true"
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
mkdir -p "$DESTDIR$site" "$DESTDIR/usr/bin"
cp -r mesonbuild "$DESTDIR$site/"
python3 -m compileall -q --invalidation-mode checked-hash -s "$DESTDIR" "$DESTDIR$site/mesonbuild"
install -m755 meson.py "$DESTDIR/usr/bin/meson"
sed -i '1s|.*|#!/usr/bin/python3|' "$DESTDIR/usr/bin/meson"
'''
